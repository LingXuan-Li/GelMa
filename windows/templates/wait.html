<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Please Wait</title>
  <style>
    body {
      background-color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .wrapper {
      border: 3px solid #999;       /* 外枠のグレー線 */
      padding: 20px 40px;
      background-color: #ffffff;    /* 白背景にして少し浮かせる */
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.5em;
      color: #333;
    }

    .wave-container {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .box {
      width: 20px;
      height: 20px;
      border: 2px solid #999999;
      animation: waveBorder 2s ease-in-out infinite;
    }

    @keyframes waveBorder {
      0%, 39%, 100% { border-color: #999999; }
      40%, 49%      { border-color: #990011; }
      50%           { border-color: #999999; }
    }

    .box:nth-child(1) { animation-delay: 0s; }
    .box:nth-child(2) { animation-delay: 0.1s; }
    .box:nth-child(3) { animation-delay: 0.2s; }
    .box:nth-child(4) { animation-delay: 0.3s; }
    .box:nth-child(5) { animation-delay: 0.4s; }
    .box:nth-child(6) { animation-delay: 0.5s; }
    .box:nth-child(7) { animation-delay: 0.6s; }
    .box:nth-child(8) { animation-delay: 0.7s; }
    .box:nth-child(9) { animation-delay: 0.8s; }
    .box:nth-child(10){ animation-delay: 0.9s; }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Please Wait For Few Moments …</h1>
    <div class="wave-container">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
  </div>
</body>
</html>
