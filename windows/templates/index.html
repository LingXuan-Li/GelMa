<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Qt WebChannel -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<title>GelMa - HOME</title>

<link rel="stylesheet" href="css/index.css">
</head>

<body>

<div class="container">

    <div class="header">
        <div class="img-container">
            <img src="./figure/icon.svg" alt="GelMa Icon">
            <img src="./figure/logo.svg" alt="GelMa Text Logo">
        </div>
        <br>
        <p>TV Web Viewer Shortcut Manager</p>
    </div>

    <!-- Search -->
    <div class="search-section">
        <input
            type="text"
            id="searchInput"
            placeholder="Search on Google..."
        />

        <button onclick="googleSearch()">
            🔍 Search
        </button>
    </div>

    <!-- Add Shortcut -->
    <div class="add-shortcut-section">

        <div class="add-shortcut-form">

            <input
                type="text"
                id="shortcutName"
                placeholder="Site Name / Shortcut Name"
            />

            <input
                type="text"
                id="shortcutUrl"
                placeholder="https://example.com"
            />

            <button onclick="addShortcut()">
                + Add Shortcut
            </button>

        </div>

    </div>

    <!-- Grid -->
    <div class="shortcuts-title">
        Saved Shortcuts
    </div>

    <div
        class="tiles-grid"
        id="shortcutsGrid">
    </div>

    <div
        class="empty-message display-none"
        id="emptyMessage"
    >
        Please add some shortcuts!
    </div>

    <div class="footer">
        GelMa v1.0
    </div>

</div>

<script src="js/index.js"></script>

</body>
</html>
